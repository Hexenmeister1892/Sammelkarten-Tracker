<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mein Kartentracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#eef1f5;--sf:#fff;--tx:#14213d;--mu:#5d6b82;--bd:#d5dbe6;--ac:#1d4ed8;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-g="pk"]{--ac:#c8102e}
:root[data-g="hb"]{--ac:#005ca9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1626;--sf:#16223a;--tx:#e8edf7;--mu:#93a1ba;--bd:#26344f;--ac:#6ea0ff;--on:#0e1626}
:root:not([data-theme="light"])[data-g="pk"]{--ac:#ff6b7f}
:root:not([data-theme="light"])[data-g="hb"]{--ac:#6aa9ff}}
:root[data-theme="dark"]{--bg:#0e1626;--sf:#16223a;--tx:#e8edf7;--mu:#93a1ba;--bd:#26344f;--ac:#6ea0ff;--on:#0e1626}
:root[data-theme="dark"][data-g="pk"]{--ac:#ff6b7f}
:root[data-theme="dark"][data-g="hb"]{--ac:#6aa9ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 'Bricolage Grotesque',system-ui,sans-serif}
#app{max-width:640px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:1.5rem;font-weight:800;margin:4px 0 14px;letter-spacing:-.01em}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{flex:1;padding:11px 8px;border:2px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.tab.on{background:var(--ac);border-color:var(--ac);color:var(--on)}
.sub .tab{padding:8px;font-size:.92rem}
select,input[type=text],input[type=search]{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--sf);color:var(--tx);font:inherit;margin-bottom:10px}
select{font-weight:600}
.bar{display:flex;justify-content:space-between;align-items:baseline;margin:6px 2px 8px;color:var(--mu);font-size:.9rem}
.bar b{color:var(--tx)}
ul{list-style:none;margin:0;padding:0;background:var(--sf);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:1fr 40px 66px 48px 24px;gap:8px;align-items:center;padding:10px 12px;border-top:1px solid var(--bd)}
.row:first-child{border-top:0}
.row.d{grid-template-columns:44px 1fr 1fr 32px}
.row.j{grid-template-columns:1fr 40px 66px 48px}
.dx{border-top:1px solid var(--bd);padding:10px 12px}
.dx:first-child{border-top:0}
.dx.have{border-left:4px solid var(--ac);padding-left:8px}
.dh{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:baseline;cursor:pointer}
.ty{color:var(--mu);font-size:.8rem;text-align:right}
.dc{display:flex;gap:8px;align-items:center;margin:6px 0 0 52px;font-size:.9rem}
.dc span:first-child{flex:1}
.da{display:flex;gap:8px;margin:8px 0 0 52px}
.da input{margin:0}
.btn.sm{width:44px;flex:none;padding:10px}
.fl{display:flex;gap:8px}.fl select{flex:1;min-width:0}
.hd{color:var(--mu);font-size:.8rem;background:var(--bg)}
.row label{display:flex;gap:10px;align-items:center;min-width:0}
.row input[type=checkbox]{width:22px;height:22px;accent-color:var(--ac);flex:none}
.nm{overflow-wrap:anywhere}
.nm small{display:block;color:var(--mu);font-size:.78rem}
.nr,.pr{color:var(--mu);font-size:.85rem;white-space:nowrap}
.x{border:0;background:none;color:var(--mu);font-size:1.3rem;cursor:pointer;padding:0}
.empty{padding:18px 14px;color:var(--mu)}
.add{margin-top:14px;padding:12px;background:var(--sf);border:1px solid var(--bd);border-radius:12px}
.add h2{font-size:1rem;margin:0 0 8px}
.add .g{display:flex;gap:8px}
.add .g input{margin-bottom:8px}
.btn{width:100%;padding:12px;border:0;border-radius:10px;background:var(--ac);color:var(--on);font:inherit;font-weight:700;cursor:pointer}
.note{margin-top:16px;color:var(--mu);font-size:.82rem}
.hb{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 12px;border-top:1px solid var(--bd)}
.hb:first-child{border-top:0}
.hb label{display:flex;gap:10px;align-items:center;min-width:0}
.hb input{width:22px;height:22px;accent-color:var(--ac);flex:none}
.dbl{display:flex;align-items:center;gap:6px}
.dbl button{width:34px;height:34px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:1.15rem;cursor:pointer}
.dbl span{min-width:1.4em;text-align:center;font-weight:600}
.lb{display:flex;gap:10px;align-items:center;min-width:0}
.nm[data-a="img"]{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
#lbx{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
#lbx[hidden]{display:none}
.lbb{background:var(--sf);color:var(--tx);border-radius:14px;padding:14px;max-width:420px;width:100%;max-height:100%;overflow:auto;text-align:center}
.lbb .t{font-weight:700}
.lbb .s{color:var(--mu);font-size:.85rem}
.lbb img{max-width:100%;max-height:58vh;border-radius:8px;display:block;margin:10px auto}
.lbn{display:flex;align-items:center;justify-content:center;gap:14px;margin:8px 0 10px}
.lbn button{width:44px;height:40px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:1.3rem;cursor:pointer}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
</style>
</head>

  if(V.st==='f'&&c.length)return false;
  return !q||(d.name+' '+d.n+' '+d.t.join(' ')+' '+c.join(' ')).toLowerCase().indexOf(q)>-1});
 var h='<div class="bar"><span>Im Pokédex: <b>'+own+'</b> von <b>'+DX.length+'</b> Pokémon</span></div>';
 if(!rows.length){h+='<ul><li class="empty">Nichts gefunden.</li></ul>'}
 else{h+='<ul>'+rows.map(function(d){var c=S.dx[d.n]||[];
  return '<li class="dx'+(c.length?' have':'')+'"><div class="dh" data-a="dxopen" data-n="'+d.n+'" role="button" tabindex="0"><span class="nr">'+('000'+d.n).slice(-4)+'</span><span class="nm">'+esc(d.name)+'</span><span class="ty">'+d.t.map(esc).join(' / ')+'</span></div>'
  +c.map(function(x,i){return '<div class="dc"><span>'+esc(x)+'</span><span class="pr">–</span><button class="x" data-a="dxdel" data-n="'+d.n+'" data-i="'+i+'" aria-label="Karte entfernen">×</button></div>'}).join('')
  +(V.open===d.n?'<div class="da"><input type="text" id="dxi" placeholder="Set-Nummer, z. B. 30C 058/128"><button class="btn sm" data-a="dxadd" data-n="'+d.n+'">+</button></div>':'')+'</li>'}).join('')+'</ul>'}
 $('list').innerHTML=h;
}
function renderHB(){
 var q=V.q.toLowerCase(),own=0,dbl=0;
 HBL.forEach(function(c){if(hbo(c))own++;dbl+=hbd(c)});
 var rows=HBL.filter(function(c){var o=hbo(c),d=hbd(c);
  if(V.st==='h'&&!o)return false;
  if(V.st==='f'&&o)return false;
  if(V.st==='d'&&!d)return false;
  return !q||(c.nr+' '+c.name+' '+c.sp+' '+c.pg).toLowerCase().indexOf(q)>-1});
 var h='<div class="bar"><span>Im Besitz <b>'+own+'</b> von <b>'+HBL.length+'</b> · Doppelt <b>'+dbl+'</b></span></div>';
 if(!rows.length)h+='<ul><li class="empty">Nichts gefunden.</li></ul>';
 else h+='<ul>'+rows.map(function(c){var d=hbd(c),meta=[c.pg?'Seite '+c.pg:'',c.sp].filter(Boolean).join(' · ');
  return '<li class="hb"><label><input type="checkbox" data-a="hbown" data-n="'+c.nr+'"'+(hbo(c)?' checked':'')+'><span class="nm"><b>'+esc(c.nr)+'</b> '+esc(c.name)+(meta?'<small>'+esc(meta)+'</small>':'')+'</span></label><div class="dbl" title="Doppelt"><button data-a="hbm" data-n="'+c.nr+'" aria-label="Weniger doppelt">−</button><span>'+d+'</span><button data-a="hbp" data-n="'+c.nr+'" aria-label="Mehr doppelt">+</button></div></li>'}).join('')+'</ul>';
 $('list').innerHTML=h;
}
var IMGB='https://en.onepiece-cardgame.com/images/cardlist/card/';
var LB={c:null,k:0};
function opK(c){var k=(c.r==='TR'||c.r==='SP CARD')?1:0;if(c.sec==='AA')k+=1;else if(c.sec==='Manga')k+=2;else if(c.sec.indexOf('Variante')===0)k+=parseInt(c.sec.slice(9),10)-1;return Math.min(k,6)}
function lbShow(){var c=LB.c,u=IMGB+c.nr+(LB.k?'_p'+LB.k:'')+'.png';
 $('lbx').hidden=false;
 $('lbx').innerHTML='<div class="lbb"><div class="t">'+esc(c.name)+'</div><div class="s">'+esc(c.nr)+' · '+esc(c.r)+(c.sec!=='Normal'?' · '+esc(c.sec):'')+'</div><img id="lbi" alt="'+esc(c.name)+'" src="'+u+'"><div id="lbm" class="s"></div><div class="lbn"><button data-a="lbp" aria-label="Vorherige Version">‹</button><span>Version '+(LB.k+1)+'</span><button data-a="lbn" aria-label="Nächste Version">›</button></div><button class="btn" data-a="lbc">Schließen</button></div>';
 var im=$('lbi');im.onerror=function(){im.style.display='none';$('lbm').textContent='Dieses Bild konnte nicht geladen werden. Mit ‹ › kannst du andere Versionen probieren.'}}
function reset(){V.q=V.rf=V.sf=V.st=''}
document.addEventListener('click',function(e){
 if(e.target.id==='lbx'){$('lbx').hidden=true;return}
 var b=e.target.closest('[data-a]');if(!b)return;var a=b.dataset.a;
 if(a==='img'){var cc=opRows(V.set).filter(function(x){return x.id===b.dataset.id})[0];if(cc){LB.c=cc;LB.k=cc.id in S.iv?S.iv[cc.id]:opK(cc);lbShow()}}
 else if(a==='lbp'||a==='lbn'){LB.k=Math.max(0,Math.min(6,LB.k+(a==='lbn'?1:-1)));S.iv[LB.c.id]=LB.k;save();lbShow()}
 else if(a==='lbc'){$('lbx').hidden=true}
 else if(a==='game'){V.game=b.dataset.v;reset();render()}
 else if(a==='sub'){V.sub=b.dataset.v;reset();render()}
 else if(a==='dxopen'){var n0=+b.dataset.n;V.open=V.open===n0?0:n0;renderList();var el=$('dxi');if(el)el.focus()}
 else if(a==='dxadd'){var n1=+b.dataset.n,iv=$('dxi'),v=iv?iv.value.trim():'';if(!v)return;(S.dx[n1]||(S.dx[n1]=[])).push(v);save();V.open=0;renderList()}
 else if(a==='dxdel'){var n2=+b.dataset.n;S.dx[n2].splice(+b.dataset.i,1);if(!S.dx[n2].length)delete S.dx[n2];save();renderList()}
 else if(a==='hbp'||a==='hbm'){var n=b.dataset.n,c=HBL.filter(function(x){return x.nr===n})[0],d=hbd(c);if(a==='hbp'){S.hd[n]=d+1;S.ho[n]=1}else S.hd[n]=Math.max(0,d-1);save();renderList()}
});
document.addEventListener('change',function(e){
 var t=e.target,a=t.dataset&&t.dataset.a;
 if(t.id==='setsel'){V.set=t.value;reset();render()}
 else if(t.id==='rf'){V.rf=t.value;renderList()}
 else if(t.id==='sf'){V.sf=t.value;renderList()}
 else if(t.id==='ty'){V.ty=t.value;renderList()}
 else if(t.id==='st'){V.st=t.value;renderList()}
 else if(a==='own'){S.own[t.dataset.id]=t.checked?1:0;save();renderList()}
 else if(a==='hbown'){S.ho[t.dataset.n]=t.checked?1:0;save();renderList()}
});
document.addEventListener('input',function(e){if(e.target.id==='q'){V.q=e.target.value;renderList()}});
document.addEventListener('keydown',function(e){if(e.key==='Escape')$('lbx').hidden=true;if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.a==='img')e.target.click();if(e.key==='Enter'&&e.target.id==='dxi'){var b=document.querySelector('[data-a="dxadd"]');if(b)b.click()}});
render();
</script>
</body>
</html>
